# Frontera Rivera — editor visual de contenido en Pages CMS
# Las colecciones se publican automáticamente mediante Jekyll en GitHub Pages.
media:
  - name: fotos
    label: Fotografías
    input: assets/img
    output: /assets/img
    categories: [image]
    rename: safe
  - name: audios
    label: Canciones y audios
    input: assets/audio
    output: /assets/audio
    categories: [audio]
    rename: safe

content:
  - name: inicio
    label: Portada del inicio
    type: file
    path: _data/inicio.json
    format: json
    operations:
      delete: false
    fields:
      - name: linea1
        label: Primera línea del título
        type: string
        required: true
      - name: linea2
        label: Segunda línea
        type: string
        required: true
      - name: destacado
        label: Palabra destacada
        type: string
        required: true
      - name: introduccion
        label: Texto de presentación
        type: text
        required: true
      - name: portada
        label: Fotografía principal
        type: image
        options:
          media: fotos
      - name: credito
        label: Crédito de la fotografía
        type: string

  - name: galeria
    label: Galería de fotos
    type: file
    path: _data/galeria.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: Identificador único
        type: string
        description: No cambies el ID de una fotografía ya publicada.
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descripción o crédito
        type: text
      - name: image
        label: Fotografía
        type: image
        required: true
        options:
          media: fotos

  - name: musica
    label: Música
    type: file
    path: _data/musica.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Título de la canción
        type: string
        required: true
      - name: artist
        label: Artista o intérprete
        type: string
        required: true
      - name: description
        label: Descripción
        type: text
      - name: audio
        label: Archivo de audio
        type: file
        required: true
        options:
          media: audios
          categories: [audio]

  - name: homenajes
    label: Homenajes
    type: file
    path: _data/homenajes.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: name
        label: Nombre
        type: string
        required: true
      - name: slug
        label: URL corta (sin espacios)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: Ejemplo: walter-silva-godoy. No modificar si ya está publicado.
      - name: image
        label: Retrato (opcional)
        type: image
        options:
          media: fotos
      - name: biography
        label: Historia, recuerdos y biografía
        type: rich-text
        options:
          format: markdown

  - name: publicaciones
    label: Nuevos artículos
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [README.md, .gitkeep]
    view:
      fields: [title, author]
      primary: title
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Bajada o resumen
        type: text
      - name: author
        label: Autor
        type: string
      - name: image
        label: Fotografía principal
        type: image
        options:
          media: fotos
      - name: body
        label: Texto del artículo
        type: rich-text
        options:
          format: markdown
          media: fotos

settings:
  commit:
    templates:
      create: "Contenido: agregar {path} desde Pages CMS"
      update: "Contenido: actualizar {path} desde Pages CMS"
      delete: "Contenido: eliminar {path} desde Pages CMS"
