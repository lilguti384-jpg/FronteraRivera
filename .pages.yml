      - name: titulo_identidad
        label: "titulo identidad"
        type: string
      - name: identidad_parrafo_1
        label: "identidad parrafo 1"
        type: text
      - name: identidad_parrafo_2
        label: "identidad parrafo 2"
        type: text
      - name: etiqueta_descubri
        label: "etiqueta descubri"
        type: string
      - name: titulo_descubri
        label: "titulo descubri"
        type: string
      - name: bajada_descubri
        label: "bajada descubri"
        type: string
      - name: fecha_ascenso
        label: "fecha ascenso"
        type: string
      - name: titulo_ascenso
        label: "titulo ascenso"
        type: string
      - name: bajada_ascenso
        label: "bajada ascenso"
        type: text
      - name: imagen_ascenso
        label: "imagen ascenso"
        type: image
        options:
          media: fotos
      - name: etiqueta_simbolos
        label: "etiqueta simbolos"
        type: string
      - name: titulo_simbolos
        label: "titulo simbolos"
        type: string
      - name: bajada_simbolos
        label: "bajada simbolos"
        type: string
      - name: etiqueta_fotos
        label: "etiqueta fotos"
        type: string
      - name: titulo_fotos
        label: "titulo fotos"
        type: string
      - name: bajada_fotos
        label: "bajada fotos"
        type: string
      - name: etiqueta_musica
        label: "etiqueta musica"
        type: string
      - name: titulo_musica
        label: "titulo musica"
        type: text
      - name: bajada_musica
        label: "bajada musica"
        type: string

  - name: portada_galeria
    label: "Fotos destacadas del Inicio"
    type: file
    path: _data/portada_galeria.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: titulo
        label: "Pie de foto"
        type: string
      - name: imagen
        label: "Fotografía"
        type: image
        options:
          media: fotos
      - name: alt
        label: "Descripción de la imagen"
        type: text

  - name: historia_texto
    label: "Relato completo de Historia"
    type: file
    path: _data/historia_texto.json
    format: json
    operations:
      delete: false
    fields:
      - name: subtitulo
        label: "Etiqueta"
        type: string
      - name: titulo
        label: "Título del relato"
        type: string
      - name: cuerpo
        label: "Texto completo"
        type: rich-text
        options:
          format: markdown
      - name: imagen
        label: "Imagen de Historia"
        type: image
        options:
          media: fotos
      - name: imagen_credito
        label: "Pie de imagen"
