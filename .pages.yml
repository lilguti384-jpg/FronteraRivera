  - name: videos
    label: "Frontera TV — videos"
    type: file
    path: _data/videos.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: "ID de YouTube (11 caracteres)"
        type: string
        required: true
        pattern: "^[A-Za-z0-9_-]{11}$"
      - name: inicio
        label: "Empezar desde el segundo (0 si no)"
        type: number
      - name: etiqueta
        label: "Categoría del video"
        type: string
      - name: titulo
        label: "Título"
        type: string
      - name: descripcion
        label: "Descripción"
        type: text

  - name: textos_paginas
    label: "Títulos y textos de cada página"
    type: file
    path: _data/textos_paginas.json
    format: json
    operations:
      delete: false
    fields:
      - name: historia
        label: "Historia"
        type: object
        fields:
          - name: etiqueta
            label: "Etiqueta"
            type: string
          - name: titulo
            label: "Título principal"
            type: string
          - name: descripcion
            label: "Subtítulo"
            type: text
          - name: cronologia_titulo
            label: "Título cronología"
            type: string
          - name: cronologia_descripcion
            label: "Descripción cronología"
            type: text
      - name: galeria
        label: "Galería"
        type: object
        fields:
          - name: etiqueta
            label: "Etiqueta"
            type: string
          - name: titulo
            label: "Título principal"
            type: string
          - name: descripcion
            label: "Subtítulo"
            type: text
          - name: subtitulo
            label: "Título del archivo"
            type: string
          - name: bajada
            label: "Bajada del archivo"
            type: text
      - name: musica
        label: "Música"
        type: object
        fields:
          - name: etiqueta
            label: "Etiqueta"
            type: string
          - name: titulo
            label: "Título principal"
            type: string
          - name: descripcion
            label: "Subtítulo"
            type: text
          - name: bajada
            label: "Bajada del catálogo"
            type: text
      - name: homenajes
        label: "Homenajes"
        type: object
        fields:
          - name: etiqueta
            label: "Etiqueta"
            type: string
          - name: titulo
            label: "Título principal"
            type: string
          - name: descripcion
            label: "Descripción"
            type: text
          - name: subtitulo
            label: "Título de las tarjetas"
            type: string
          - name: bajada
            label: "Bajada de las tarjetas"
            type: text
      - name: tv
        label: "Frontera TV"
        type: object
        fields:
          - name: etiqueta
            label: "Etiqueta"
