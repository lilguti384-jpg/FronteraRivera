# Frontera Rivera — editor visual de contenido en Pages CMS
# Las colecciones se publican automáticamente mediante Jekyll en GitHub Pages.
media:
  - name: fotos
    label: Fotografías
    input: assets/img
    output: /assets/img
    categories: [image]
    rename: safe
  - name: audios
    label: Canciones y audios
    input: assets/audio
    output: /assets/audio
    categories: [audio]
    rename: safe

content:
  - name: comunicados
    label: Comunicados del club
    type: collection
    path: _comunicados
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [.gitkeep]
    view:
      fields: [title, date, published]
      primary: title
    fields:
      - name: title
        label: Título del comunicado
        type: string
        required: true
      - name: date
        label: Fecha del comunicado
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: description
        label: Resumen para el listado y las redes
        type: text
      - name: author
        label: Firma
        type: string
        default: Comisión Directiva
      - name: body
        label: Texto del comunicado
        type: rich-text
        required: true
        options:
          format: markdown
      - name: published
        label: Publicar en la web
        type: boolean
        default: false
        description: Activá esta opción cuando el texto y la fecha estén confirmados.

  - name: comunicados_pt
    label: Comunicados en portugués
    type: collection
    path: _comunicados_pt
    format: yaml-frontmatter
    filename: "{fields.original}.md"
    exclude: [.gitkeep]
    view:
      fields: [title, date, published]
      primary: title
    fields:
      - name: original
        label: Nombre del archivo original en español (sin .md)
        type: string
        required: true
        description: Copiá el nombre exacto para vincular las banderas. Ejemplo 2026-11-10-citacion-a-asamblea-general-extraordinaria
      - name: title
        label: Título del comunicado
        type: string
        required: true
      - name: date
        label: Fecha del comunicado
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: description
        label: Resumen para el listado y las redes
        type: text
      - name: author
        label: Firma
        type: string
        default: Comissão Diretiva
      - name: body
        label: Texto del comunicado
        type: rich-text
        required: true
        options:
          format: markdown
      - name: published
        label: Publicar en la web
        type: boolean
        default: false
        description: Activá esta opción cuando el texto y la fecha estén confirmados.

  - name: inicio
    label: Portada del inicio
    type: file
    path: _data/inicio.json
    format: json
    operations:
      delete: false
    fields:
      - name: linea1
        label: Primera línea del título
        type: string
        required: true
      - name: linea2
        label: Segunda línea
        type: string
        required: true
      - name: destacado
        label: Palabra destacada
        type: string
        required: true
      - name: introduccion
        label: Texto de presentación
        type: text
        required: true
      - name: portada
        label: Fotografía principal
        type: image
        options:
          media: fotos
      - name: credito
        label: Crédito de la fotografía
        type: string
      - name: kicker
        label: "Texto pequeño arriba del título"
        type: string
      - name: frase_foto
        label: "Frase junto a la fotografía"
        type: string

  - name: galeria
    label: Galería de fotos
    type: file
    path: _data/galeria.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: Identificador único
        type: string
        description: No cambies el ID de una fotografía ya publicada.
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descripción o crédito
        type: text
      - name: image
        label: Fotografía
        type: image
        required: true
        options:
          media: fotos

  - name: musica
    label: Música
    type: file
    path: _data/musica.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Título de la canción
        type: string
        required: true
      - name: artist
        label: Artista o intérprete
        type: string
        required: true
      - name: description
        label: Descripción
        type: text
      - name: audio
        label: Archivo de audio
        type: file
        required: true
        options:
          media: audios
          categories: [audio]

  - name: homenajes
    label: Homenajes
    type: file
    path: _data/homenajes.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: name
        label: Nombre
        type: string
        required: true
      - name: slug
        label: URL corta (sin espacios)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Ejemplo: walter-silva-godoy. No modificar si ya está publicado."
      - name: image
        label: Retrato (opcional)
        type: image
        options:
          media: fotos
      - name: biography
        label: Historia, recuerdos y biografía
        type: rich-text
        options:
          format: markdown

  - name: publicaciones
    label: Nuevos artículos
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [README.md, .gitkeep]
    view:
      fields: [title, author]
      primary: title
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Bajada o resumen
        type: text
      - name: author
        label: Autor
        type: string
      - name: image
        label: Fotografía principal
        type: image
        options:
          media: fotos
      - name: body
        label: Texto del artículo
        type: rich-text
        options:
          format: markdown
          media: fotos

  - name: frases
    label: "Frase del Padre Silva"
    type: file
    path: _data/frases.json
    format: json
    operations:
      delete: false
    fields:
      - name: etiqueta
        label: "Etiqueta pequeña"
        type: string
      - name: cita_padre_silva
        label: "Cita íntegra del Padre Silva"
        type: text
      - name: autor_padre_silva
        label: "Autor de la cita"
        type: string
      - name: imagen
        label: "Foto de la hinchada junto a la cita"
        type: image
        options:
          media: fotos
      - name: pie_imagen
        label: "Pie de foto"
        type: string

  - name: bloques_inicio
    label: "Más textos del Inicio"
    type: file
    path: _data/bloques_inicio.json
    format: json
    operations:
      delete: false
    fields:
      - name: etiqueta_identidad
        label: "etiqueta identidad"
